name: panote CodeQL config

# Test code only, and only where a whole file is tests. `paths-ignore` works per
# file, so it deliberately does NOT cover the `#[cfg(test)]` modules inside
# crypto/vault.rs and friends - excluding those would stop scanning the real
# crypto alongside the fixtures. Those tests derive their salts with
# `random_salt()` instead, so nothing needs suppressing and a hard-coded salt
# reaching production code still raises an alert.
paths-ignore:
  - e2e
  - "**/*.test.ts"
  - src-tauri/src/folders/tests.rs
  - src-tauri/src/transfer/e2e_tests.rs
